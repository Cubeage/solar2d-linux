name: Build Solar2DBuilder for Linux

# Auto-builds a new release whenever Solar2D publishes a new version.
# Also supports manual dispatch with optional version override.
on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 06:00 UTC — check for new Solar2D releases
  workflow_dispatch:
    inputs:
      solar2d_build:
        description: 'Solar2D build number (blank = latest)'
        required: false
        default: ''
      solar2d_year:
        description: 'Solar2D year (blank = auto-detect)'
        required: false
        default: ''
      package_revision:
        description: 'Packaging revision of the same Solar2D build (e.g. 1 → release tag YEAR.BUILD.1). Blank = first packaging.'
        required: false
        default: ''
      repack_from:
        description: 'Repack a published package instead of compiling: base release tag (e.g. 2026.3728) or build number. Blank = build from source.'
        required: false
        default: ''
      force:
        description: 'Force rebuild even if already released'
        type: boolean
        default: false

permissions:
  contents: write # softprops/action-gh-release publishes the build

jobs:
  # ── Check if a new Solar2D release is available ─────────────────────
  check:
    name: Check for new Solar2D release
    runs-on: sylphx-linux-standard
    outputs:
      build:       ${{ steps.detect.outputs.build }}
      year:        ${{ steps.detect.outputs.year }}
      pkgver:      ${{ steps.detect.outputs.pkgver }}
      tag:         ${{ steps.detect.outputs.tag }}
      should_build: ${{ steps.detect.outputs.should_build }}
    steps:
      - name: Detect version and compare
        id: detect
        env:
          # Authenticated API calls: the shared runner IPs hit the anonymous
          # rate limit (403) on the scheduled run of 2026-09-26.
          GH_API_AUTH: "Authorization: Bearer ${{ github.token }}"
        run: |
          # Resolve target Solar2D version
          INPUT_BUILD="${{ github.event.inputs.solar2d_build }}"
          if [ -n "$INPUT_BUILD" ]; then
            BUILD="$INPUT_BUILD"
            INPUT_YEAR="${{ github.event.inputs.solar2d_year }}"
            if [ -n "$INPUT_YEAR" ]; then
              YEAR="$INPUT_YEAR"
            else
              # Auto-detect year from the release name
              YEAR=$(curl -fsSL -H "$GH_API_AUTH" "https://api.github.com/repos/coronalabs/corona/releases/tags/${BUILD}" \
                | jq -r '.name' | grep -oP '^\d{4}' || echo "$(date +%Y)")
            fi
          else
            # Get latest Solar2D release
            RELEASE=$(curl -fsSL -H "$GH_API_AUTH" "https://api.github.com/repos/coronalabs/corona/releases/latest")
            BUILD=$(echo "$RELEASE" | jq -r '.tag_name')
            YEAR=$(echo "$RELEASE" | jq -r '.name' | grep -oP '^\d{4}' || echo "$(date +%Y)")
          fi

          # Packaging revision: same upstream build, repackaged (e.g. a fixed
          # Android template). The tarball keeps the upstream build number so
          # downstream pins only change the release tag they download from.
          REV="${{ github.event.inputs.package_revision }}"
          PKGVER="${BUILD}${REV:+.${REV}}"
          TAG="${YEAR}.${PKGVER}"
          echo "Target: Solar2D ${TAG}"

          # Has this upstream build been packaged already (first packaging or a
          # revision of it)?  Comparing only against the *latest* release would
          # rebuild/overwrite the existing asset every day as soon as a revision
          # becomes the latest release.
          EXISTING=$(curl -fsSL -H "$GH_API_AUTH" "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | jq -r '.[].tag_name' 2>/dev/null \
            | grep -E "^${YEAR}\.${BUILD}(\.[0-9]+)?$" | sort -V | tail -1 || true)
          echo "Existing packaging for Solar2D ${YEAR}.${BUILD}: ${EXISTING:-none}"

          FORCE="${{ github.event.inputs.force }}"
          SHOULD_BUILD=true
          if [ "$FORCE" != "true" ]; then
            if [ -n "$REV" ]; then
              [ "$EXISTING" = "$TAG" ] && SHOULD_BUILD=false
            else
              [ -n "$EXISTING" ] && SHOULD_BUILD=false
            fi
          fi
          if [ "$SHOULD_BUILD" != "true" ]; then
            echo "Solar2D ${YEAR}.${BUILD} is already packaged as ${EXISTING}; skipping."
            echo "Use package_revision=<N> to publish another revision, or force=true to rebuild ${TAG}."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building: ${TAG}"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

          echo "build=${BUILD}"  >> "$GITHUB_OUTPUT"
          echo "year=${YEAR}"    >> "$GITHUB_OUTPUT"
          echo "pkgver=${PKGVER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"      >> "$GITHUB_OUTPUT"

  # ── Build and publish ────────────────────────────────────────────────
  build:
    name: Build Solar2DBuilder ${{ needs.check.outputs.tag }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: sylphx-linux-standard    # Pin to 22.04 for glibc 2.35 compatibility
    env:
      BUILD: ${{ needs.check.outputs.build }}
      YEAR:  ${{ needs.check.outputs.year }}
      PKGVER: ${{ needs.check.outputs.pkgver }}
      TAG:   ${{ needs.check.outputs.tag }}
      REPACK_FROM: ${{ github.event.inputs.repack_from }}
    steps:
      # ── Install build dependencies ─────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build git \
            openjdk-17-jdk-headless \
            libcurl4-openssl-dev libfreetype6-dev \
            libgl1-mesa-dev libglu1-mesa-dev libgl1-mesa-dri libglx-mesa0 \
            libopenal-dev libpng-dev libjpeg-dev libssl-dev \
            libvorbis-dev libogg-dev uuid-dev zlib1g-dev \
            libsdl2-dev p7zip-full xvfb unzip python3

      # ── Checkout this repo (for patches) ───────────────────────────
      - name: Checkout solar2d-linux (patches)
        uses: actions/checkout@v4
        with:
          path: solar2d-linux

      # ── Template patch unit tests (cheap, fail fast) ───────────────
      - name: Test Android template patch script
        run: python3 -m unittest discover -s solar2d-linux/tests -t solar2d-linux -v

      # ── Clone Solar2D source at tag ─────────────────────────────────
      - name: Clone coronalabs/corona @ ${{ env.BUILD }}
        if: env.REPACK_FROM == ''
        run: |
          git clone --recursive --depth 1 --branch "$BUILD" \
            https://github.com/coronalabs/corona.git solar2d-src
          echo "Cloned Solar2D ${BUILD} ($(git -C solar2d-src rev-parse --short HEAD))"

      # ── Apply patches ───────────────────────────────────────────────
      - name: Apply Linux Android patches
        if: env.REPACK_FROM == ''
        run: |
          cd solar2d-src
          for PATCH in ../solar2d-linux/patches/*.patch; do
            echo "Applying: $(basename "$PATCH")"
            git apply "$PATCH"
          done
          echo "All patches applied successfully"

      # ── Build Solar2DBuilder ────────────────────────────────────────
      - name: Build Solar2DBuilder
        if: env.REPACK_FROM == ''
        run: |
          # Configure from the REPOSITORY ROOT: the root CMakeLists.txt sets
          # CORONA_ROOT/ALSOFT_NATIVE_TOOLS_PATH and includes
          # platform/linux/CMakeList.txt.  `cmake ../..` from
          # platform/linux/build pointed at platform/, which has no
          # CMakeLists.txt (all scheduled runs failed there).
          cd solar2d-src
          BUILD_NUMBER="${BUILD}" YEAR="${YEAR}" cmake -S . -B platform/linux/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_NUMBER="${BUILD}" \
            -DYEAR="${YEAR}"
          ninja -C platform/linux/build Solar2DBuilder
          echo "Binary: $(du -sh platform/linux/build/Solar2DBuilder)"

      # ── Get Corona.aar from CoronaCards-Android release ─────────────
      - name: Download Corona.aar
        if: env.REPACK_FROM == ''
        run: |
          URL="https://github.com/coronalabs/corona/releases/download/${BUILD}/CoronaCards-Android-${TAG}.zip"
          echo "Downloading: $URL"
          curl -fsSL "$URL" -o CoronaCards-Android.zip
          mkdir -p android-templates
          cd android-templates
          unzip -q ../CoronaCards-Android.zip
          # Older releases nest the AAR in CoronaCardsAndroidAAR.zip; from
          # 2026.3731 the release zip holds CoronaCards.aar directly.
          if [ -f CoronaCardsAndroidAAR.zip ]; then unzip -q CoronaCardsAndroidAAR.zip; fi
          test -f CoronaCards.aar || { echo "::error::CoronaCards.aar not found in release zip"; ls -la; exit 1; }
          mv CoronaCards.aar Corona.aar
          echo "Corona.aar: $(du -sh Corona.aar)"

      # ── Get android-template.zip from macOS DMG ─────────────────────
      - name: Extract android-template.zip from macOS DMG
        if: env.REPACK_FROM == ''
        run: |
          URL="https://github.com/coronalabs/corona/releases/download/${BUILD}/Solar2D-macOS-${TAG}.dmg"
          echo "Downloading DMG (large): $URL"
          curl -fsSL "$URL" -o Solar2D.dmg

          mkdir -p dmg-extract && cd dmg-extract
          7z x ../Solar2D.dmg -o./outer 2>&1 | tail -5
          HFS=$(find outer -type f -size +50M 2>/dev/null | head -1)
          if [ -n "$HFS" ]; then
            7z x "$HFS" -o./inner 2>&1 | tail -5
          else
            mv outer inner
          fi

          TEMPLATE=$(find . -name "android-template.zip" 2>/dev/null | head -1)
          if [ -z "$TEMPLATE" ]; then
            echo "ERROR: android-template.zip not found in DMG" && exit 1
          fi
          cp "$TEMPLATE" ../android-templates/android-template.zip
          echo "android-template.zip: $(du -sh ../android-templates/android-template.zip)"

          cd ..
          rm -f Solar2D.dmg
          rm -rf dmg-extract

      # ── Repack mode: reuse a published package as the base ──────────
      # Same binary, same resources; only the Android template is replaced.
      # Used for packaging revisions of an already released upstream build.
      - name: Download base package to repack (${{ env.REPACK_FROM }})
        if: env.REPACK_FROM != ''
        run: |
          set -euo pipefail
          BASE_TAG="${REPACK_FROM}"
          case "$BASE_TAG" in
            *.*) ;;
            *) BASE_TAG="${YEAR}.${BASE_TAG}" ;;
          esac
          URL="https://github.com/${{ github.repository }}/releases/download/${BASE_TAG}/solar2dbuilder-linux-${BUILD}.tar.gz"
          echo "Repacking base release: ${URL}"
          curl -fsSL "$URL" -o base.tar.gz
          sha256sum base.tar.gz | tee base.sha256
          tar -xzf base.tar.gz
          [ -d "solar2d-linux-${BUILD}" ] || { echo "base package has no solar2d-linux-${BUILD} directory" >&2; exit 1; }
          mkdir -p android-templates
          cp "solar2d-linux-${BUILD}/Resources/android-template.zip" android-templates/android-template.zip

      # ── Patch the Android Gradle template ──────────────────────────
      # Solar2D 2026.3728 hardcodes compileSdk/targetSdk = 35 in its template
      # and only reads minSdkVersion from build.settings, so projects that
      # declare android.targetSdkVersion still ship an artifact Play rejects
      # ("Target SDK of artifact is too low").  Fail closed on anchor drift.
      - name: Patch Android template (build.settings target SDK)
        run: |
          python3 solar2d-linux/scripts/patch-android-template.py android-templates/android-template.zip

      - name: Verify patched template
        run: |
          set -euo pipefail
          T=$(mktemp -d)
          unzip -q android-templates/android-template.zip 'template/app/build.gradle.kts' -d "$T"
          F="$T/template/app/build.gradle.kts"
          grep -qF 'buildSettings.android.targetSdkVersion' "$F"
          grep -qF 'compileSdk = coronaCompileSdkVersion' "$F"
          grep -qF 'targetSdk = coronaTargetSdkVersion' "$F"
          if grep -qE '^[[:space:]]*(compileSdk|targetSdk) = [0-9]+[[:space:]]*$' "$F"; then
            echo "ERROR: hardcoded SDK level still present in template" >&2
            exit 1
          fi
          echo "Verified: template honours build.settings android.targetSdkVersion"

      # ── Repack: put the patched template back into the base package ─
      - name: Repack base package with patched template
        if: env.REPACK_FROM != ''
        run: |
          set -euo pipefail
          PKG="solar2d-linux-${BUILD}"
          cp android-templates/android-template.zip "${PKG}/Resources/android-template.zip"
          cp android-templates/android-template.zip "${PKG}/Resources/Native/Corona/android/resource/android-template.zip"
          tar -czf "solar2dbuilder-linux-${BUILD}.tar.gz" "${PKG}"
          echo "TARBALL=solar2dbuilder-linux-${BUILD}.tar.gz" >> "$GITHUB_ENV"
          sha256sum "solar2dbuilder-linux-${BUILD}.tar.gz"
          echo "Repacked $(du -sh "solar2dbuilder-linux-${BUILD}.tar.gz" | cut -f1) from $(cat base.sha256)"

      # ── Assemble package ────────────────────────────────────────────
      - name: Assemble release package
        if: env.REPACK_FROM == ''
        run: |
          PKG="solar2d-linux-${BUILD}"
          mkdir -p "${PKG}/lib" "${PKG}/Resources/Native/Corona/android/resource" \
                                "${PKG}/Resources/Native/Corona/android/lib/gradle" \
                                "${PKG}/Resources/Native/Corona/shared/resource"

          # Binary
          cp solar2d-src/platform/linux/build/Solar2DBuilder "${PKG}/"
          chmod +x "${PKG}/Solar2DBuilder"

          # Wrapper script (LD_LIBRARY_PATH + xvfb-run)
          cat > "${PKG}/Solar2DBuilder.sh" << 'WRAPPER'
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "$(readlink -f "$0")")" && pwd)"
          export LD_LIBRARY_PATH="${DIR}/lib:${LD_LIBRARY_PATH:-}"
          exec xvfb-run -a "${DIR}/Solar2DBuilder" "$@"
          WRAPPER
          chmod +x "${PKG}/Solar2DBuilder.sh"

          # Bundle shared libraries
          ldd "${PKG}/Solar2DBuilder" \
            | awk '/=>/ && $3 ~ /^\// {print $3}' | sort -u \
            | xargs -I{} cp -n {} "${PKG}/lib/" 2>/dev/null || true
          echo "Bundled $(ls "${PKG}/lib/" | wc -l) shared libs"

          # Resources: processed resource tree CMakeResources.txt builds next to
          # the binary (ant.jar/ant-launcher.jar/build.xml/debug.keystore/...)
          cp -r solar2d-src/platform/linux/build/Resources/. "${PKG}/Resources/"

          # Resources: Lua scripts + configs from source
          cp -r solar2d-src/platform/resources/. "${PKG}/Resources/"

          # Resources: shared runtime scripts the Android template loads via the
          # bundled lua binary (Native/Corona/shared/resource, e.g. json.lua)
          cp solar2d-src/platform/resources/*.lua "${PKG}/Resources/Native/Corona/shared/resource/"
          cp solar2d-src/platform/android/create_build_properties.lua \
             "${PKG}/Resources/Native/Corona/shared/resource/"
          cp solar2d-src/tools/CoronaBuilder/CoronaBuilder.lua           "${PKG}/Resources/" 2>/dev/null || true
          cp solar2d-src/tools/CoronaBuilder/BuilderPluginDownloader.lua "${PKG}/Resources/" 2>/dev/null || true

          # Resources: jar files from source
          cp solar2d-src/platform/android/project/AntInvoke/AntInvoke.jar       "${PKG}/Resources/" 2>/dev/null || true
          cp solar2d-src/platform/android/project/ListKeyStore/ListKeyStore.jar  "${PKG}/Resources/" 2>/dev/null || true
          cp solar2d-src/platform/android/AntLiveManifest/AntLiveManifest.jar   "${PKG}/Resources/" 2>/dev/null || true
          cp solar2d-src/platform/android/resources/_coronatest.jar              "${PKG}/Resources/" 2>/dev/null || true

          # Resources: Android templates (top-level + Native subdir)
          cp android-templates/Corona.aar           "${PKG}/Resources/"
          cp android-templates/android-template.zip "${PKG}/Resources/"
          cp android-templates/android-template.zip "${PKG}/Resources/Native/Corona/android/resource/"
          cp android-templates/Corona.aar           "${PKG}/Resources/Native/Corona/android/lib/gradle/"

          echo "Resources: $(find "${PKG}/Resources" -type f | wc -l) files"
          echo "Package total: $(du -sh "${PKG}" | cut -f1)"

          # Tarball
          tar -czf "solar2dbuilder-linux-${BUILD}.tar.gz" "${PKG}"
          echo "TARBALL=solar2dbuilder-linux-${BUILD}.tar.gz" >> "$GITHUB_ENV"
          echo "Tarball: $(du -sh "solar2dbuilder-linux-${BUILD}.tar.gz" | cut -f1)"

      # ── Smoke test ──────────────────────────────────────────────────
      - name: Smoke test
        run: |
          PKG="solar2d-linux-${BUILD}"
          export LD_LIBRARY_PATH="${PKG}/lib"
          xvfb-run -a "${PKG}/Solar2DBuilder" --version 2>&1 || \
          xvfb-run -a "${PKG}/Solar2DBuilder" --help 2>&1 | head -5 || \
          echo "(exit code non-zero is OK for --help)"

      # ── Publish GitHub Release ──────────────────────────────────────
      - name: Publish release ${{ env.TAG }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Solar2DBuilder Linux ${{ env.TAG }}
          body: |
            Linux build of `Solar2DBuilder` for CI/CD Android APK builds.

            Built from [Solar2D ${{ env.BUILD }}](https://github.com/coronalabs/corona/releases/tag/${{ env.BUILD }}) open source with [Linux Android patches](https://github.com/${{ github.repository }}/tree/main/patches). Package version: `${{ env.PKGVER }}` (the tarball keeps the upstream build number in its name).

            Packaging: ${{ env.REPACK_FROM != '' && format('repacked from `{0}` — same binary, Android template patched', env.REPACK_FROM) || format('built from Solar2D {0} source', env.BUILD) }}

            Android template patch: `template/app/build.gradle.kts` now reads `build.settings` `android.targetSdkVersion` (falling back to the template default) and uses `compileSdk = maxOf(default, targetSdk)`, so an app can declare a target platform newer than the template's hardcoded one (needed for Google Play's API-level floor).

            ## Quick start

            ```bash
            # Download
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/solar2dbuilder-linux-${{ env.BUILD }}.tar.gz \
              | tar -xz

            # Run (wrapper handles LD_LIBRARY_PATH + xvfb)
            cd solar2d-linux-${{ env.BUILD }}
            ./Solar2DBuilder.sh build --lua path/to/recipe-android.lua
            ```

            ## GitHub Actions (add to your workflow)

            ```yaml
            - name: Build APK
              run: |
                curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/solar2dbuilder-linux-${{ env.BUILD }}.tar.gz \
                  | tar -xz
                cd solar2d-linux-${{ env.BUILD }}
                ./Solar2DBuilder.sh build --lua client/ci/recipe-android.lua
            ```

            ## Patches applied
            See [`patches/`](https://github.com/${{ github.repository }}/tree/main/patches) for the 4 fixes that enable Linux Android builds, plus [`scripts/patch-android-template.py`](https://github.com/${{ github.repository }}/blob/main/scripts/patch-android-template.py) for the Android template target-SDK fix.
          files: ${{ env.TARBALL }}
